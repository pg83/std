name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish next release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="$({
            gh release list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json tagName \
              --jq '.[].tagName'
          } | awk '/^[1-9][0-9]*$/ { if ($1 > max) max = $1 } END { print max + 1 }')"

          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$GITHUB_SHA"
          else
            git config user.name "std release bot"
            git config user.email "noreply@github.com"
            git tag --annotate "$tag" "$GITHUB_SHA" --message "Release $tag"
            git push origin "refs/tags/$tag"
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --generate-notes
